# Streamlit settings for `uv run hsk web` (ADR 0014). `hsk web` also passes these
# as flags (cli.WEB_FLAGS), so they hold from any folder.
[server]
address = "127.0.0.1"  # only this computer can open the page (port: cli.WEB_PORT)
headless = true  # no first-run email question; `hsk web` opens the browser itself

[browser]
gatherUsageStats = false  # send no usage data to Streamlit

[client]
toolbarMode = "minimal"  # no "Deploy" button: this app is never published online
