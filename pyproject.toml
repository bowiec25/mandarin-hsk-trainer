[project]
name = "mandarin-hsk-trainer"
version = "0.1.0"
description = "HSK 3.0 (bands 1-3) Mandarin vocab trainer, built from reusable blocks"
readme = "README.md"
authors = [
    { name = "Cameron Bowie", email = "221522165+bowiec25@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.2",
]

[project.scripts]
hsk = "hsk_trainer.cli:main"

[tool.uv.build-backend]
# Two packages in one project: generic quizkit + Mandarin-specific hsk_trainer (ADR 0003)
module-name = ["quizkit", "hsk_trainer"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
